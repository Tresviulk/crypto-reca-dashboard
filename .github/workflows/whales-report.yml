name: WHALES Canonical Report

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/whales-report.mjs'
      - 'scripts/whales-report-enhance.mjs'
      - 'scripts/whales-cex-flow-batched.mjs'
      - 'scripts/whales-early-entry.mjs'
      - 'scripts/whales-early-entry-integrate.mjs'
      - 'data/whales-early-entry-state.json'
      - 'data/whales-deep-state.json'
      - 'data/whales-multichain-state.json'
      - 'data/whales-state.json'
      - 'data/solana-fixed-kol-feed-state.json'
      - 'data/whales-discovery-state.json'
      - 'data/whales-promoted-wallets.json'
      - 'data/whales-promoted-live-state.json'
      - 'data/cabal-machine.json'
      - 'data/positions-state.json'
      - 'config/whales-multichain.json'
      - '.github/workflows/whales-report.yml'

permissions:
  contents: write

concurrency:
  group: whales-canonical-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build full WHALES report
        run: node scripts/whales-report.mjs

      - name: Integrate persistent WHALES intelligence layers
        run: node scripts/whales-report-enhance.mjs

      - name: Harden CEX flows with batched chunked RPC failover
        run: node scripts/whales-cex-flow-batched.mjs

      - name: Re-integrate wallet-first early-entry state
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/whales-early-entry-state.json ]; then
            node scripts/whales-early-entry-integrate.mjs
          else
            echo 'Early-entry state not initialized yet; canonical report continues without it for this run.'
          fi

      - name: Validate report contract and persistent layers
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/whales-report.json >/dev/null
          python -m json.tool data/whales-net-accumulation.json >/dev/null
          python -m json.tool data/whales-cex-flows.json >/dev/null
          python - <<'PY'
          import json, os
          d=json.load(open('data/whales-report.json',encoding='utf-8'))
          mandatory=d.get('reportContract',{}).get('mandatorySections',[])
          missing=[k for k in mandatory if k not in d]
          if missing: raise SystemExit(f'missing WHALES report sections: {missing}')
          required={
            'executive','health','coverage','fixedCohort','discovery','newWalletDiscovery',
            'promotedDiscoveryLive','confirmedBuys','confirmedSells','deepValidation',
            'largeTransfers','netAccumulation','cexFlows','smartMoneyExternal','solana',
            'hyperliquid','convergence','cabalCross','portfolioCross','decisionTable','dataGaps'
          }
          if os.path.exists('data/whales-early-entry-state.json'):
            required.add('earlyEntry')
          absent=sorted(required-set(mandatory))
          if absent: raise SystemExit(f'WHALES mandatory contract missing: {absent}')
          if len(mandatory) < 21: raise SystemExit('WHALES report contract too small')
          deep=d.get('deepValidation',{})
          if os.path.exists('data/whales-deep-state.json'):
            s=json.load(open('data/whales-deep-state.json',encoding='utf-8'))
            if deep.get('windowsExpectedHours') != [6,24,72]: raise SystemExit('WHALES DEEP windows missing from report')
            if s.get('runStatus') in {'PASS','PARTIAL'} and not deep.get('persistedResultsAvailable'):
              raise SystemExit('persisted WHALES DEEP state was not integrated into report')
          net=json.load(open('data/whales-net-accumulation.json',encoding='utf-8'))
          if net.get('status') != 'PASS': raise SystemExit('net accumulation ledger is not PASS')
          if not all(k in net.get('windows',{}) for k in ['6h','24h','72h','7d','30d']): raise SystemExit('net accumulation windows incomplete')
          cex=json.load(open('data/whales-cex-flows.json',encoding='utf-8'))
          if cex.get('status') not in {'PASS','PARTIAL'}: raise SystemExit('CEX flow labeler did not initialize')
          chain_health=cex.get('chainHealth',{})
          if chain_health and all(v.get('status')=='ERROR' for v in chain_health.values()): raise SystemExit('CEX EVM scanner failed on every chain')
          if d.get('netAccumulation',{}).get('status') != 'PASS': raise SystemExit('net ledger not integrated into WHALES report')
          if d.get('cexFlows',{}).get('status') not in {'PASS','PARTIAL'}: raise SystemExit('CEX flow state not integrated into WHALES report')
          if os.path.exists('data/whales-early-entry-state.json'):
            e=json.load(open('data/whales-early-entry-state.json',encoding='utf-8'))
            if d.get('earlyEntry',{}).get('generatedAt') != e.get('generatedAt'):
              raise SystemExit('early-entry state not integrated into WHALES report')
          print('WHALES REPORT VALID', d['generatedAt'], 'sections=',len(mandatory), 'deep=',deep.get('status'), 'net=',d['netAccumulation']['status'], 'cex=',d['cexFlows']['status'], 'early=',d.get('earlyEntry',{}).get('status'))
          print('CEX CHAIN HEALTH', {k:v.get('status') for k,v in chain_health.items()})
          PY

      - name: Commit canonical report and persistent intelligence states
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/whales-report.json data/whales-net-accumulation.json data/whales-cex-flows.json
          if git diff --cached --quiet; then
            echo 'No WHALES report/intelligence change.'
            exit 0
          fi
          git commit -m 'whales: refresh canonical report and persistent intelligence'
          # whales-early-entry-integrate also refreshes the master report in-memory.
          # This workflow does not own that file; the System Master workflow persists it.
          # Restore only that known side effect so rebase can proceed without silently
          # discarding or committing unrelated state.
          git restore --worktree data/system-master-report.json
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Unexpected post-commit worktree changes:' >&2
            git status --short >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "WHALES report persisted on attempt ${attempt}."
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying after fetch/rebase."
            sleep $((attempt * 2))
          done
          echo 'Failed to persist WHALES report after 5 attempts.' >&2
          exit 1

      - name: Verify persisted report and intelligence states
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/whales-report.json | python -m json.tool >/dev/null
          git show origin/main:data/whales-net-accumulation.json | python -m json.tool >/dev/null
          git show origin/main:data/whales-cex-flows.json | python -m json.tool >/dev/null
          echo 'WHALES REPORT + INTELLIGENCE PERSISTENCE PASS'
