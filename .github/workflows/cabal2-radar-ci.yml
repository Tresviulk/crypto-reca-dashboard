name: CABAL 2.0 Radar CI

on:
  push:
    branches: ["cabal-2-clean-rebuild"]
    paths:
      - 'cloudflare/cabal2-radar/**'
      - 'scripts/cabal2_radar_regression.mjs'
      - 'scripts/cabal2_source_smoke.mjs'
      - 'scripts/cabal2_source_smoke.mjs'
      - 'docs/CABAL_2_0_ARCHITECTURE.md'
      - '.github/workflows/cabal2-radar-ci.yml'
  pull_request:
    paths:
      - 'cloudflare/cabal2-radar/**'
      - 'scripts/cabal2_radar_regression.mjs'
      - 'docs/CABAL_2_0_ARCHITECTURE.md'
      - '.github/workflows/cabal2-radar-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check cloudflare/cabal2-radar/src/index.mjs
          node --check cloudflare/cabal2-radar/src/radar-core.mjs
      - name: Radar regression
        run: node scripts/cabal2_radar_regression.mjs
      - name: Live source smoke
        run: node scripts/cabal2_source_smoke.mjs

      - name: Production scheduler probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cabal2-radar/schedules"
          curl -fsS "$api" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/schedules.json
          curl -fsS https://cabal2-radar.diondublin21.workers.dev/health -o /tmp/health.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/schedules.json',encoding='utf-8'))
          h=json.load(open('/tmp/health.json',encoding='utf-8'))
          print('CABAL2 PROBE SCHEDULES',json.dumps(s.get('result') or {}))
          print('CABAL2 PROBE HEALTH',json.dumps({
              'version':h.get('version'),
              'healthy':h.get('healthy'),
              'schedulerHealthy':h.get('schedulerHealthy'),
              'ageSeconds':h.get('ageSeconds'),
              'schedulerAgeSeconds':h.get('schedulerAgeSeconds'),
              'scheduler':h.get('scheduler'),
              'lastGeneratedAt':(h.get('last') or {}).get('generatedAt'),
              'lastError':h.get('lastError')
          }))
          PY
