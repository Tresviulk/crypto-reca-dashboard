name: HYPE Hourly NTFY Status

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/hype-hourly-ntfy.yml'

permissions:
  contents: read

concurrency:
  group: hype-hourly-ntfy
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Build HYPE hourly status
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, math, time, urllib.request
          from datetime import datetime, timezone

          NTFY_TOPIC = "cabal-jr-7k29m4xq81"

          # User-confirmed open position
          QTY = 7.557
          TOTAL_COST = 599.85  # USDC, includes entry fee
          ENTRY_AVG = 79.25

          # Current protection reference discussed with user.
          # This does NOT assert that the exchange stop order has been placed.
          STOP_REF = 82.25
          LIMIT_REF = 82.20
          UPSIDE_LEVEL = 85.00

          url = (
              "https://api.coingecko.com/api/v3/simple/price"
              "?ids=hyperliquid&vs_currencies=usd&include_24hr_change=true"
          )

          payload = None
          last_err = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "crypto-reca-dashboard/1.0"
                      }
                  )
                  with urllib.request.urlopen(req, timeout=20) as r:
                      payload = json.loads(r.read().decode("utf-8"))
                  if "hyperliquid" in payload and "usd" in payload["hyperliquid"]:
                      break
              except Exception as e:
                  last_err = str(e)
                  time.sleep(2 * (attempt + 1))

          now = datetime.now(timezone.utc).isoformat().replace("+00:00","Z")

          if not payload or "hyperliquid" not in payload or "usd" not in payload["hyperliquid"]:
              out = {
                  "title": "⚠️ HYPE — datos no disponibles",
                  "priority": "default",
                  "message": (
                      f"No se pudo obtener el precio de HYPE tras 3 intentos.\n"
                      f"Hora UTC: {now}\n"
                      f"Último error: {last_err or 'unknown'}"
                  )
              }
          else:
              d = payload["hyperliquid"]
              price = float(d["usd"])
              ch24 = d.get("usd_24h_change")
              ch24 = float(ch24) if ch24 is not None and math.isfinite(float(ch24)) else None

              value = QTY * price
              pnl = value - TOTAL_COST
              pnl_pct = (pnl / TOTAL_COST) * 100.0
              distance_stop_pct = ((price / STOP_REF) - 1.0) * 100.0

              if price >= UPSIDE_LEVEL:
                  state = "🟢 FUERTE — por encima de 85"
              elif price >= 82.50:
                  state = "🟢 MANTENER — por encima de la zona de protección"
              elif price >= STOP_REF:
                  state = "🟠 ATENCIÓN — muy cerca del stop de referencia"
              else:
                  state = "🔴 ZONA STOP — revisar si la orden se ha ejecutado"

              ch24_txt = f"{ch24:+.2f}%" if ch24 is not None else "n/a"
              pnl_txt = f"{pnl:+.2f} USDC ({pnl_pct:+.2f}%)"
              dist_txt = f"{distance_stop_pct:+.2f}%"

              msg = (
                  f"PRECIO: {price:.4f} USD\n"
                  f"P/L ABIERTO: {pnl_txt}\n"
                  f"24H: {ch24_txt}\n"
                  f"STOP REF.: {STOP_REF:.2f} | LÍMITE REF.: {LIMIT_REF:.2f}\n"
                  f"DISTANCIA AL STOP: {dist_txt}\n"
                  f"ESTADO: {state}\n\n"
                  f"Posición: {QTY} HYPE | Coste total: {TOTAL_COST:.2f} USDC.\n"
                  f"Seguimiento informativo; no ejecuta órdenes."
              )

              out = {
                  "title": "📊 HYPE — ESTADO HORARIO",
                  "priority": "default",
                  "message": msg
              }

          with open("/tmp/hype-ntfy.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False)

          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Send one ntfy push
        shell: bash
        run: |
          set -euo pipefail

          title=$(python -c 'import json; print(json.load(open("/tmp/hype-ntfy.json"))["title"])')
          priority=$(python -c 'import json; print(json.load(open("/tmp/hype-ntfy.json"))["priority"])')
          message=$(python -c 'import json; print(json.load(open("/tmp/hype-ntfy.json"))["message"])')

          curl -fsS \
            -H "Title: $title" \
            -H "Priority: $priority" \
            --data-binary "$message" \
            https://ntfy.sh/cabal-jr-7k29m4xq81
