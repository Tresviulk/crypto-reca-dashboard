name: Deploy CABAL Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'cloudflare/cabal-scanner/**'
      - '.github/workflows/deploy-cabal-worker.yml'

permissions:
  contents: read

concurrency:
  group: deploy-cabal-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate deployable worker source
        shell: bash
        run: |
          set -euo pipefail
          test -s cloudflare/cabal-scanner/src/index.js
          node --check cloudflare/cabal-scanner/src/index.js
          grep -q 'async scheduled' cloudflare/cabal-scanner/src/index.js
          grep -q 'CLOUDFLARE_1M_MARKET_GUARD' cloudflare/cabal-scanner/src/index.js
          grep -q 'CLOUDFLARE_5M_EXECUTION_GUARD' cloudflare/cabal-scanner/src/index.js
          grep -q 'WATCH_PERSIST_ONLY' cloudflare/cabal-scanner/src/index.js
          grep -q '"crons": \["\* \* \* \* \*"\]' cloudflare/cabal-scanner/wrangler.jsonc

      - name: Run CABAL regression suite
        run: python scripts/cabal_regression_v2.py

      - name: Neutralize Cloudflare Workers Builds production promotion
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"

          http=$(curl -sS -o /tmp/cf-workers.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${API}/workers/scripts")
          if [ "${http}" != "200" ]; then
            echo "Cannot enumerate Cloudflare Workers (HTTP ${http})." >&2
            cat /tmp/cf-workers.json >&2
            exit 1
          fi

          python - <<'PY' > /tmp/cabal-worker-tag.txt
          import json
          d=json.load(open('/tmp/cf-workers.json',encoding='utf-8'))
          rows=d.get('result') or []
          hit=next((x for x in rows if x.get('id')=='cabal-scanner'),None)
          if not hit or not hit.get('tag'):
              raise SystemExit('Cloudflare worker tag for cabal-scanner not found')
          print(hit['tag'])
          PY
          WORKER_TAG=$(cat /tmp/cabal-worker-tag.txt)

          http=$(curl -sS -o /tmp/cf-build-triggers.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${API}/builds/workers/${WORKER_TAG}/triggers")
          if [ "${http}" != "200" ]; then
            echo "Cloudflare Workers Builds trigger API unavailable (HTTP ${http})." >&2
            echo "The deployment token needs Workers Builds Configuration: Edit / Workers CI Write." >&2
            cat /tmp/cf-build-triggers.json >&2
            exit 1
          fi

          python - <<'PY' > /tmp/cabal-production-triggers.txt
          import json
          d=json.load(open('/tmp/cf-build-triggers.json',encoding='utf-8'))
          for t in d.get('result') or []:
              branches=t.get('branch_includes') or []
              cmd=str(t.get('deploy_command') or '')
              if 'main' in branches and 'versions upload' not in cmd:
                  u=t.get('trigger_uuid')
                  if u: print(u)
          PY

          if [ ! -s /tmp/cabal-production-triggers.txt ]; then
            echo 'Cloudflare Workers Builds production promotion already neutralized.'
          else
            while IFS= read -r TRIGGER_UUID; do
              echo "Neutralizing production promotion for Workers Builds trigger ${TRIGGER_UUID}"
              http=$(curl -sS -o /tmp/cf-trigger-patch.json -w '%{http_code}' \
                -X PATCH \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data '{"deploy_command":"npx wrangler versions upload"}' \
                "${API}/builds/triggers/${TRIGGER_UUID}")
              if [ "${http}" != "200" ]; then
                echo "Failed to neutralize Workers Builds trigger (HTTP ${http})." >&2
                cat /tmp/cf-trigger-patch.json >&2
                exit 1
              fi
              python - <<'PY'
          import json
          d=json.load(open('/tmp/cf-trigger-patch.json',encoding='utf-8'))
          if d.get('success') is not True:
              raise SystemExit(f"Cloudflare trigger patch failed: {d.get('errors')}")
          print('WORKERS BUILDS PRODUCTION PROMOTION DISABLED')
          PY
            done < /tmp/cabal-production-triggers.txt
          fi

      - name: Deploy cabal-scanner
        working-directory: cloudflare/cabal-scanner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy | tee /tmp/cabal-first-deploy.log
          grep 'Current Version ID:' /tmp/cabal-first-deploy.log | tail -1 | awk '{print $4}' > /tmp/cabal-first-version.txt
          echo "FIRST_VERSION=$(cat /tmp/cabal-first-version.txt)"

      - name: Detect and neutralize competing Cloudflare deployment
        working-directory: cloudflare/cabal-scanner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DEPLOYMENTS IMMEDIATELY AFTER GITHUB DEPLOY ==='
          npx --yes wrangler@latest deployments list --json | tee /tmp/cf-deployments-immediate.json

          # A second Cloudflare/Workers Build has previously overwritten the GitHub
          # deployment within ~75 seconds. Give any competing build time to finish,
          # inspect the production deployment again, then make this workflow the
          # final writer.
          sleep 90

          echo '=== DEPLOYMENTS AFTER 90S SETTLE WINDOW ==='
          npx --yes wrangler@latest deployments list --json | tee /tmp/cf-deployments-after-wait.json

          echo '=== FINAL AUTHORITATIVE REDEPLOY ==='
          npx --yes wrangler@latest deploy | tee /tmp/cabal-final-deploy.log
          grep 'Current Version ID:' /tmp/cabal-final-deploy.log | tail -1 | awk '{print $4}' > /tmp/cabal-final-version.txt
          echo "FINAL_VERSION=$(cat /tmp/cabal-final-version.txt)"

          echo '=== DEPLOYMENTS AFTER FINAL REDEPLOY ==='
          npx --yes wrangler@latest deployments list --json | tee /tmp/cf-deployments-final.json

      - name: Verify live health over multiple 1-minute cycles
        shell: bash
        run: |
          set -euo pipefail
          sleep 75
          rm -f /tmp/cabal-health-samples.jsonl

          for i in 1 2 3 4; do
            curl -fsS --retry 4 --retry-delay 5 --max-time 15 \
              https://cabal-scanner.diondublin21.workers.dev/health \
              -o /tmp/cabal-health.json

            python - <<'PY'
          import json
          d=json.load(open('/tmp/cabal-health.json',encoding='utf-8'))
          required=(
              'healthy','lastSuccessfulScan','schedulerLagSeconds',
              'lastObservationGapSeconds','maxObservationGapSeconds',
              'consecutiveHealthyCycles','verificationNotifiedAt',
              'patchVersion','executionGuard','watchRadar'
          )
          missing=[k for k in required if k not in d]
          if missing:
              raise SystemExit(f'health missing keys: {missing}')
          if d.get('mode')!='CLOUDFLARE_1M_MARKET_GUARD':
              raise SystemExit(f"unexpected guard mode: {d.get('mode')}")
          if d.get('patchVersion')!='CABAL_WHALES_V3_1_2_2026-09-23_EXEC_GUARD':
              raise SystemExit(f"wrong worker version served: {d.get('patchVersion')}")
          eg=d.get('executionGuard') or {}
          if eg.get('mode')!='CLOUDFLARE_5M_EXECUTION_GUARD':
              raise SystemExit(f"execution guard missing/wrong: {eg}")
          if d.get('healthy') is not True:
              raise SystemExit(f"market guard not healthy: {d}")
          def n(key, default=9999):
              v=d.get(key)
              return default if v is None else float(v)
          if n('ageSeconds')>150:
              raise SystemExit(f"guard stale: {d}")
          if n('schedulerLagSeconds')>120:
              raise SystemExit(f"scheduler lag too high: {d}")
          if n('lastObservationGapSeconds')>150:
              raise SystemExit(f"observation gap too high: {d}")
          if n('maxObservationGapSeconds')>180:
              raise SystemExit(f"max observation gap too high: {d}")
          with open('/tmp/cabal-health-samples.jsonl','a',encoding='utf-8') as fh:
              fh.write(json.dumps(d,ensure_ascii=False)+'\n')
          print('CABAL HEALTH SAMPLE PASS', json.dumps(d,ensure_ascii=False))
          PY

            if [ "$i" -lt 4 ]; then sleep 65; fi
          done

          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('/tmp/cabal-health-samples.jsonl',encoding='utf-8') if x.strip()]
          if len(rows)!=4:
              raise SystemExit(f'expected 4 health samples, got {len(rows)}')
          last=rows[-1]
          if int(last.get('consecutiveHealthyCycles') or 0)<3:
              raise SystemExit(f"insufficient consecutive healthy cycles: {last}")
          expected='CABAL_WHALES_V3_1_2_2026-09-23_EXEC_GUARD'
          versions={r.get('patchVersion') for r in rows}
          if versions!={expected}:
              raise SystemExit(f'mixed worker versions served during verification: {versions}')
          execution_runs=[(r.get('executionGuard') or {}).get('lastRunAt') for r in rows]
          if not any(execution_runs):
              raise SystemExit(f'5-minute execution guard did not run during verification: {execution_runs}')
          # NTFY transport is not part of scanner structural health. Quota/backoff
          # may degrade push delivery without invalidating the 1-minute market guard.
          if not last.get('verificationNotifiedAt') or last.get('verificationNotifyError'):
              print('CABAL NTFY VERIFICATION DEGRADED', json.dumps({
                  'verificationNotifiedAt':last.get('verificationNotifiedAt'),
                  'verificationNotifyError':last.get('verificationNotifyError'),
                  'notificationHealthy':last.get('notificationHealthy'),
                  'notificationMode':last.get('notificationMode')
              },ensure_ascii=False))
          print('CABAL STRUCTURAL LIVE VERIFICATION PASS', json.dumps({
              'samples':len(rows),
              'consecutiveHealthyCycles':last.get('consecutiveHealthyCycles'),
              'verificationNotifiedAt':last.get('verificationNotifiedAt'),
              'schedulerLagSeconds':last.get('schedulerLagSeconds'),
              'lastObservationGapSeconds':last.get('lastObservationGapSeconds'),
              'maxObservationGapSeconds':last.get('maxObservationGapSeconds'),
              'lastUniverseCount':last.get('lastUniverseCount'),
              'patchVersion':last.get('patchVersion'),
              'executionGuard':last.get('executionGuard')
          },ensure_ascii=False))
          PY
