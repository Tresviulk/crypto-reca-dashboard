name: Deploy CABAL Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'cloudflare/cabal-scanner/**'
      - '.github/workflows/deploy-cabal-worker.yml'

permissions:
  contents: read

concurrency:
  group: deploy-cabal-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate deployable worker source
        shell: bash
        run: |
          set -euo pipefail
          test -s cloudflare/cabal-scanner/src/index.js
          node --check cloudflare/cabal-scanner/src/index.js
          grep -q 'async scheduled' cloudflare/cabal-scanner/src/index.js
          grep -q 'CLOUDFLARE_1M_MARKET_GUARD' cloudflare/cabal-scanner/src/index.js
          grep -q 'CLOUDFLARE_5M_EXECUTION_GUARD' cloudflare/cabal-scanner/src/index.js
          grep -q 'WATCH_PERSIST_ONLY' cloudflare/cabal-scanner/src/index.js
          grep -q '"crons": \["\* \* \* \* \*"\]' cloudflare/cabal-scanner/wrangler.jsonc

      - name: Run CABAL regression suite
        run: python scripts/cabal_regression_v2.py

      - name: Deploy cabal-scanner
        working-directory: cloudflare/cabal-scanner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify live health over multiple 1-minute cycles
        shell: bash
        run: |
          set -euo pipefail
          sleep 75
          rm -f /tmp/cabal-health-samples.jsonl

          for i in 1 2 3 4; do
            curl -fsS --retry 4 --retry-delay 5 --max-time 15 \
              https://cabal-scanner.diondublin21.workers.dev/health \
              -o /tmp/cabal-health.json

            python - <<'PY'
          import json
          d=json.load(open('/tmp/cabal-health.json',encoding='utf-8'))
          required=(
              'healthy','lastSuccessfulScan','schedulerLagSeconds',
              'lastObservationGapSeconds','maxObservationGapSeconds',
              'consecutiveHealthyCycles','verificationNotifiedAt'
          )
          missing=[k for k in required if k not in d]
          if missing:
              raise SystemExit(f'health missing keys: {missing}')
          if d.get('mode')!='CLOUDFLARE_1M_MARKET_GUARD':
              raise SystemExit(f"unexpected guard mode: {d.get('mode')}")
          if d.get('healthy') is not True:
              raise SystemExit(f"market guard not healthy: {d}")
          def n(key, default=9999):
              v=d.get(key)
              return default if v is None else float(v)
          if n('ageSeconds')>150:
              raise SystemExit(f"guard stale: {d}")
          if n('schedulerLagSeconds')>120:
              raise SystemExit(f"scheduler lag too high: {d}")
          if n('lastObservationGapSeconds')>150:
              raise SystemExit(f"observation gap too high: {d}")
          if n('maxObservationGapSeconds')>180:
              raise SystemExit(f"max observation gap too high: {d}")
          with open('/tmp/cabal-health-samples.jsonl','a',encoding='utf-8') as fh:
              fh.write(json.dumps(d,ensure_ascii=False)+'\n')
          print('CABAL HEALTH SAMPLE PASS', json.dumps(d,ensure_ascii=False))
          PY

            if [ "$i" -lt 4 ]; then sleep 65; fi
          done

          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('/tmp/cabal-health-samples.jsonl',encoding='utf-8') if x.strip()]
          if len(rows)!=4:
              raise SystemExit(f'expected 4 health samples, got {len(rows)}')
          last=rows[-1]
          if int(last.get('consecutiveHealthyCycles') or 0)<3:
              raise SystemExit(f"insufficient consecutive healthy cycles: {last}")
          # NTFY transport is not part of scanner structural health. Quota/backoff
          # may degrade push delivery without invalidating the 1-minute market guard.
          if not last.get('verificationNotifiedAt') or last.get('verificationNotifyError'):
              print('CABAL NTFY VERIFICATION DEGRADED', json.dumps({
                  'verificationNotifiedAt':last.get('verificationNotifiedAt'),
                  'verificationNotifyError':last.get('verificationNotifyError'),
                  'notificationHealthy':last.get('notificationHealthy'),
                  'notificationMode':last.get('notificationMode')
              },ensure_ascii=False))
          print('CABAL STRUCTURAL LIVE VERIFICATION PASS', json.dumps({
              'samples':len(rows),
              'consecutiveHealthyCycles':last.get('consecutiveHealthyCycles'),
              'verificationNotifiedAt':last.get('verificationNotifiedAt'),
              'schedulerLagSeconds':last.get('schedulerLagSeconds'),
              'lastObservationGapSeconds':last.get('lastObservationGapSeconds'),
              'maxObservationGapSeconds':last.get('maxObservationGapSeconds'),
              'lastUniverseCount':last.get('lastUniverseCount')
          },ensure_ascii=False))
          PY
