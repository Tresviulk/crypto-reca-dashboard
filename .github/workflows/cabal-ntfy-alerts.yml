name: CABAL v2 NTFY Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/cabal_ntfy_v2.py'
      - 'scripts/cabal_decision_v2.py'
      - '.github/workflows/cabal-ntfy-alerts.yml'

permissions:
  contents: write

concurrency:
  group: cabal-ntfy-alerts-v2
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build CABAL v2 notification
        run: python scripts/cabal_ntfy_v2.py

      - name: Revalidate BUY against newest machine state
        shell: bash
        run: |
          set -euo pipefail
          kind=$(python -c 'import json; p=json.load(open("/tmp/ntfy-payload.json")); print((p or {}).get("kind",""))')
          if [ "$kind" != "BUY" ]; then
            echo "No BUY revalidation required."
            exit 0
          fi
          git fetch origin main
          git show origin/main:data/cabal-machine.json > /tmp/latest-cabal-machine.json
          python scripts/cabal_ntfy_v2.py revalidate /tmp/latest-cabal-machine.json

      - name: Send ntfy push
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/ntfy-payload.json)" = "null" ]; then
            echo "No notification this run."
            exit 0
          fi
          title=$(python -c 'import json; print(json.load(open("/tmp/ntfy-payload.json"))["title"])')
          priority=$(python -c 'import json; print(json.load(open("/tmp/ntfy-payload.json")).get("priority","default"))')
          message=$(python -c 'import json; print(json.load(open("/tmp/ntfy-payload.json"))["message"])')
          curl -fsS \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: chart_with_upwards_trend" \
            -d "$message" \
            https://ntfy.sh/cabal-jr-7k29m4xq81

      - name: Persist CABAL v2 alert state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cp /tmp/ntfy-alert-state.json data/ntfy-alert-state.json
          git add data/ntfy-alert-state.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "cabal: refresh ntfy v2 state [skip ci]"
          git push origin HEAD:main
