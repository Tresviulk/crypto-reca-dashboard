name: Validate and deploy Crypto Reca to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy_ref: ${{ steps.radar_guard.outputs.deploy_ref }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard and auto-repair radar JSON
        id: radar_guard
        shell: bash
        run: |
          set -euo pipefail
          TARGET="data/radar-state.json"

          if python -m json.tool "$TARGET" >/dev/null 2>&1; then
            echo "Radar JSON valid at ${GITHUB_SHA}"
            echo "deploy_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Malformed ${TARGET} detected at ${GITHUB_SHA}."

          # Pull requests are validation-only: never rewrite their branch.
          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "deploy_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          import pathlib
          import subprocess

          target = 'data/radar-state.json'
          commits = subprocess.check_output(['git', 'rev-list', 'HEAD^'], text=True).splitlines()

          for commit in commits:
              try:
                  raw = subprocess.check_output(['git', 'show', f'{commit}:{target}'])
                  json.loads(raw.decode('utf-8'))
              except Exception:
                  continue

              pathlib.Path(target).write_bytes(raw)
              print(f'Restored last valid {target} from {commit}')
              break
          else:
              raise SystemExit(f'No valid historical {target} found; refusing automatic repair')
          PY

          # Validate the restored file before touching main.
          python -m json.tool "$TARGET" >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "auto-repair: restore last valid radar-state.json"
          git push origin HEAD:main

          REPAIRED_SHA="$(git rev-parse HEAD)"
          echo "Auto-repair committed as ${REPAIRED_SHA}"
          echo "deploy_ref=${REPAIRED_SHA}" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.deploy_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Validate JSON and static references
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('.')

          json_files = sorted((root / 'data').glob('*.json')) + [root / 'manifest.webmanifest']
          for path in json_files:
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  raise SystemExit(f'Invalid JSON {path}: {exc}')
              print(f'JSON OK: {path}')

          html = (root / 'index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)
          for ref in refs:
              if ref.startswith(('http://','https://','data:','#')):
                  continue
              clean = ref.split('?', 1)[0].lstrip('./')
              if not clean:
                  continue
              path = root / clean
              if not path.exists():
                  raise SystemExit(f'index.html references missing file: {ref}')
              print(f'HTML ref OK: {ref}')

          sw = (root / 'sw.js').read_text(encoding='utf-8')
          match = re.search(r'const\s+STATIC\s*=\s*\[(.*?)\];', sw, re.S)
          if not match:
              raise SystemExit('Unable to locate STATIC asset list in sw.js')
          sw_refs = re.findall(r'["\']([^"\']+)["\']', match.group(1))
          for ref in sw_refs:
              if ref in ('.', './'):
                  continue
              clean = ref.split('?', 1)[0].lstrip('./')
              path = root / clean
              if not path.exists():
                  raise SystemExit(f'sw.js caches missing file: {ref}')
              print(f'SW ref OK: {ref}')

          print('Static validation PASS')
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: [prepare, validate]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.deploy_ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
