name: Validate and deploy Crypto Reca to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Validate JSON and static references
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path('.')

          json_files = sorted((root / 'data').glob('*.json')) + [root / 'manifest.webmanifest']
          for path in json_files:
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  raise SystemExit(f'Invalid JSON {path}: {exc}')
              print(f'JSON OK: {path}')

          html = (root / 'index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)
          for ref in refs:
              if ref.startswith(('http://','https://','data:','#')):
                  continue
              clean = ref.split('?', 1)[0].lstrip('./')
              if not clean:
                  continue
              path = root / clean
              if not path.exists():
                  raise SystemExit(f'index.html references missing file: {ref}')
              print(f'HTML ref OK: {ref}')

          sw = (root / 'sw.js').read_text(encoding='utf-8')
          match = re.search(r'const\s+STATIC\s*=\s*\[(.*?)\];', sw, re.S)
          if not match:
              raise SystemExit('Unable to locate STATIC asset list in sw.js')
          sw_refs = re.findall(r'["\']([^"\']+)["\']', match.group(1))
          for ref in sw_refs:
              if ref in ('.', './'):
                  continue
              clean = ref.split('?', 1)[0].lstrip('./')
              path = root / clean
              if not path.exists():
                  raise SystemExit(f'sw.js caches missing file: {ref}')
              print(f'SW ref OK: {ref}')

          print('Static validation PASS')
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
