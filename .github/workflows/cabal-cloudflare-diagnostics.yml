name: CABAL Cloudflare Runtime Diagnosis

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/cabal-cloudflare-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read live health and Cloudflare per-worker analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,datetime,collections
          services={
            "cabal-scanner":"https://cabal-scanner.diondublin21.workers.dev/health",
            "cabal2-radar":"https://cabal2-radar.diondublin21.workers.dev/health"
          }
          for name,url in services.items():
              try:
                  req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"CABAL-Production-Diagnostics"})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      d=json.load(r)
                  result={
                    "healthy":d.get("healthy"),
                    "schedulerHealthy":d.get("schedulerHealthy"),
                    "ageSeconds":d.get("ageSeconds"),
                    "version":d.get("version") or d.get("patchVersion"),
                    "error":d.get("lastError"),
                    "guardRunAt":(d.get("executionGuard") or {}).get("lastRunAt"),
                    "radarAt":(d.get("last") or {}).get("generatedAt"),
                    "radarCount":(d.get("last") or {}).get("detectionCount"),
                    "earlyWatch":(d.get("last") or {}).get("earlyWatch"),
                    "sourceStatus":(d.get("last") or {}).get("sourceStatus")
                  }
                  print("LIVE_HEALTH",name,json.dumps(result))
              except Exception as e:
                  print("LIVE_HEALTH",name,"UNAVAILABLE",str(e))
          token=os.getenv("CLOUDFLARE_API_TOKEN")
          account=os.getenv("CLOUDFLARE_ACCOUNT_ID")
          if not token or not account:
              print("CLOUDFLARE_METRICS UNAVAILABLE: repository secrets absent")
              raise SystemExit(0)
          end=datetime.datetime.now(datetime.timezone.utc)
          start=end-datetime.timedelta(hours=4)
          q="""query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string, $scriptName: string) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                workersInvocationsAdaptive(limit: 1000, filter: {
                  scriptName: $scriptName,
                  datetime_geq: $datetimeStart,
                  datetime_leq: $datetimeEnd
                }) {
                  sum { requests errors }
                  quantiles { cpuTimeP50 cpuTimeP99 }
                  dimensions { datetime scriptName status }
                }
              }
            }
          }"""
          for name in services:
              body=json.dumps({"query":q,"variables":{
                "accountTag":account,
                "datetimeStart":start.isoformat().replace("+00:00","Z"),
                "datetimeEnd":end.isoformat().replace("+00:00","Z"),
                "scriptName":name
              }}).encode("utf-8")
              req=urllib.request.Request("https://api.cloudflare.com/client/v4/graphql",data=body,headers={
                "Authorization":"Bearer "+token,
                "Content-Type":"application/json"
              })
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data=json.load(response)
                  if data.get("errors"):
                      print("CLOUDFLARE_METRICS",name,"PERMISSION_OR_QUERY_ERROR",json.dumps(data["errors"])[:1000])
                      continue
                  accounts=((data.get("data") or {}).get("viewer") or {}).get("accounts") or []
                  records=accounts[0].get("workersInvocationsAdaptive") if accounts else []
                  counts=collections.Counter()
                  p99=0
                  for row in records or []:
                      sum_=row.get("sum") or {}
                      key=(row.get("dimensions") or {}).get("status") or "unknown"
                      counts[key]+=int(sum_.get("requests") or 0)
                      counts["ERROR_COUNT"]+=int(sum_.get("errors") or 0)
                      p99=max(p99,float((row.get("quantiles") or {}).get("cpuTimeP99") or 0))
                  print("CLOUDFLARE_METRICS",name,"last_4h",json.dumps({"sampledRows":len(records or []),"byStatus":dict(counts),"cpuTimeP99MaxRaw":p99}))
              except Exception as e:
                  print("CLOUDFLARE_METRICS",name,"UNAVAILABLE",str(e))
          PY
