name: Solana Fixed KOL Feed

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/solana-fixed-kol-feed.mjs'
      - 'config/whales-multichain.json'
      - '.github/workflows/solana-fixed-kol-feed.yml'

permissions:
  contents: write

concurrency:
  group: solana-fixed-kol-feed
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run confirmed Solana KOL feed scan
        run: node scripts/solana-fixed-kol-feed.mjs

      - name: Validate feed payload
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/solana-fixed-kol-feed-state.json >/dev/null
          python - <<'PY'
          import json
          p='data/solana-fixed-kol-feed-state.json'
          d=json.load(open(p,encoding='utf-8'))
          if not d.get('generatedAt'): raise SystemExit('missing generatedAt')
          if d.get('watchedWalletCount',0) < 1: raise SystemExit('no fixed Solana wallets')
          print('SOLANA FIXED KOL FEED VALID', d['generatedAt'], d.get('source',{}).get('status'), 'wallets=',d['watchedWalletCount'])
          PY

      - name: Commit feed state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solana-fixed-kol-feed-state.json
          if git diff --cached --quiet; then
            echo 'No Solana fixed KOL feed change.'
            exit 0
          fi
          git commit -m 'whales: refresh confirmed Solana KOL feed [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify persisted state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/solana-fixed-kol-feed-state.json | python -m json.tool >/dev/null
          echo 'SOLANA FIXED KOL FEED PERSISTENCE PASS'
