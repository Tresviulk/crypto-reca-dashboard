name: Deploy CABAL 2.0 Radar

on:
  push:
    branches: ["cabal-2-clean-rebuild"]
    paths:
      - 'cloudflare/cabal2-radar/**'
      - 'scripts/cabal2_radar_regression.mjs'
      - 'scripts/cabal2_source_smoke.mjs'
      - '.github/workflows/deploy-cabal2-radar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cabal2-radar
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate CABAL 2.0 Radar
        run: |
          set -euo pipefail
          node --check cloudflare/cabal2-radar/src/index.mjs
          node --check cloudflare/cabal2-radar/src/radar-core.mjs
          node scripts/cabal2_radar_regression.mjs
          node scripts/cabal2_source_smoke.mjs

      - name: Build isolated Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          src='cloudflare/cabal-scanner/wrangler.jsonc'
          dst='cloudflare/cabal2-radar/wrangler.generated.jsonc'
          d=json.load(open(src,encoding='utf-8'))
          d['name']='cabal2-radar'
          d['main']='src/index.mjs'
          d['compatibility_date']='2026-09-30'
          d['vars']={}
          d['triggers']={'crons':[]}
          d['durable_objects']={
              'bindings':[
                  {'name':'CABAL2_SCHEDULER','class_name':'Cabal2Scheduler'}
              ]
          }
          d['exports']={
              'Cabal2Scheduler':{'type':'durable-object','storage':'sqlite'}
          }
          json.dump(d,open(dst,'w',encoding='utf-8'),indent=2)
          print('generated',dst)
          PY

      - name: Deploy isolated CABAL 2.0 Radar
        working-directory: cloudflare/cabal2-radar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.generated.jsonc

      - name: Disable legacy Cloudflare cron schedule
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cabal2-radar/schedules"
          curl -fsS -X PUT "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '[]' \
            -o /tmp/cabal2-schedules.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cabal2-schedules.json',encoding='utf-8'))
          print('CABAL 2.0 LEGACY CRON DISABLED',json.dumps(d.get('result') or {}))
          schedules=(d.get('result') or {}).get('schedules') or []
          if d.get('success') is not True or schedules:
              raise SystemExit(f"legacy cron was not removed: {d}")
          PY

      - name: Verify live one-minute radar
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 3 --max-time 30 "https://cabal2-radar.diondublin21.workers.dev/health?bootstrap=1" -o /tmp/cabal2-health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cabal2-health.json',encoding='utf-8'))
          print('CABAL 2.0 HEALTH RAW',json.dumps(d))
          if d.get('version')!='CABAL2_RADAR_0.1.3':
              raise SystemExit(f"wrong version: {d}")
          if d.get('mode')!='CABAL2_1M_MARKET_RADAR':
              raise SystemExit(f"wrong mode: {d}")
          last=d.get('last') or {}
          if last.get('version')!='CABAL2_RADAR_0.1.3':
              raise SystemExit(f"live radar state is not current deployment: {last}")
          if last.get('autoTrade') is not False:
              raise SystemExit('CABAL 2.0 Radar must be non-trading')
          if int(last.get('universeCount') or 0)<100:
              raise SystemExit(f"universe too small: {last}")
          print('CABAL 2.0 LIVE RADAR PASS',json.dumps({
              'healthy':d.get('healthy'),
              'ageSeconds':d.get('ageSeconds'),
              'universeCount':last.get('universeCount'),
              'detectionCount':last.get('detectionCount'),
              'sourceStatus':last.get('sourceStatus'),
              'scanDurationMs':last.get('scanDurationMs')
          }))
          PY

      - name: Arm Durable Object scheduler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 3 --max-time 20 \
            https://cabal2-radar.diondublin21.workers.dev/scheduler/start \
            -o /tmp/cabal2-scheduler-arm.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cabal2-scheduler-arm.json',encoding='utf-8'))
          print('CABAL 2.0 DO SCHEDULER ARMED',json.dumps(d))
          if d.get('scheduler')!='DURABLE_OBJECT_ALARM' or d.get('armed') is not True or not d.get('armedFor'):
              raise SystemExit(f"Durable Object scheduler did not arm: {d}")
          PY

      - name: Verify Durable Object scheduler advances autonomously
        shell: bash
        run: |
          set -euo pipefail
          first=$(python -c 'import json; d=json.load(open("/tmp/cabal2-health.json")); print((d.get("last") or {}).get("generatedAt") or "")')
          echo "Waiting for Durable Object alarm autonomous execution..."
          for attempt in $(seq 1 8); do
            sleep 30
            curl -fsS --retry 3 --retry-delay 3 --max-time 20 https://cabal2-radar.diondublin21.workers.dev/health -o /tmp/cabal2-health-scheduled.json
            if python - "$first" "$attempt" <<'PY'
          import json,sys
          first=sys.argv[1]
          attempt=int(sys.argv[2])
          d=json.load(open('/tmp/cabal2-health-scheduled.json',encoding='utf-8'))
          last=d.get('last') or {}
          scheduler=d.get('scheduler') or {}
          second=last.get('generatedAt') or ''
          snapshot={
              'attempt':attempt,
              'healthy':d.get('healthy'),
              'schedulerHealthy':d.get('schedulerHealthy'),
              'ageSeconds':d.get('ageSeconds'),
              'schedulerAgeSeconds':d.get('schedulerAgeSeconds'),
              'schedulerSource':scheduler.get('source'),
              'schedulerStatus':scheduler.get('status'),
              'lastScheduledAt':scheduler.get('lastScheduledAt'),
              'firstGeneratedAt':first,
              'secondGeneratedAt':second,
              'universeCount':last.get('universeCount'),
              'detectionCount':last.get('detectionCount'),
              'scanDurationMs':last.get('scanDurationMs')
          }
          print('CABAL 2.0 DO SCHEDULER CHECK',json.dumps(snapshot))
          ok=(
              bool(first) and bool(second) and second!=first and
              d.get('healthy') is True and
              d.get('schedulerHealthy') is True and
              scheduler.get('source')=='DURABLE_OBJECT_ALARM' and
              scheduler.get('status')=='PASS'
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo "CABAL 2.0 Durable Object autonomous scheduler PASS"
              exit 0
            fi
          done
          echo "CABAL 2.0 Durable Object scheduler failed to prove autonomous execution"
          cat /tmp/cabal2-health-scheduled.json || true
          exit 1

