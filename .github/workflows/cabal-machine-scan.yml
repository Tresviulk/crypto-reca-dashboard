name: CABAL Independent Machine Discovery

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/cabal-machine-scan.py'
      - 'scripts/cabal-machine-scan-v14.py'
      - 'scripts/cabal-machine-scan-v141.py'
      - 'scripts/cabal-machine-scan-v15.py'
      - 'scripts/cabal-machine-scan-v151.py'
      - '.github/workflows/cabal-machine-scan.yml'

permissions:
  contents: write

concurrency:
  group: cabal-independent-machine-discovery
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CABAL machine v1.5.1
        run: python scripts/cabal-machine-scan-v151.py

      - name: Validate JSON shape before persistence
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/cabal-machine.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('data/cabal-machine.json',encoding='utf-8'))
          required=('generatedAt','coverage','sources','retention','preAccumCandidates','preAccumLifecycle','preAccumOperational','mainMachineOperational','sourceMode')
          missing=[k for k in required if k not in d]
          if missing: raise SystemExit(f'missing required keys: {missing}')
          if d.get('schemaVersion')!='1.5.1': raise SystemExit(f"unexpected schemaVersion: {d.get('schemaVersion')}")
          print('CABAL v1.5.1 DIAGNOSTIC', json.dumps({'preAccumOperational':d.get('preAccumOperational'),'mainMachineOperational':d.get('mainMachineOperational'),'sourceMode':d.get('sourceMode'),'coverage':d.get('coverage'),'sources':d.get('sources'),'errors':d.get('errors'),'warnings':d.get('warnings')},ensure_ascii=False))
          PY

      - name: Persist machine state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cabal-machine.json
          if git diff --cached --quiet; then
            echo 'No CABAL machine state change.'
          else
            git commit -m 'cabal-machine: refresh independent discovery v1.5.1 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Strict PRE-ACCUM coverage validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('data/cabal-machine.json',encoding='utf-8'))
          c=d['coverage']; r=d['retention']
          if not d.get('preAccumOperational'): raise SystemExit('PRE-ACCUM operational=false')
          if c.get('preAccum')!='PASS': raise SystemExit('PRE-ACCUM coverage not PASS')
          if c.get('preAccum250kTo2mUniverseCount',0)<=0: raise SystemExit('250k-2M PRE-ACCUM band not covered')
          if c.get('preAccumShortlistCount',0)<=0: raise SystemExit('PRE-ACCUM shortlist missing')
          if c.get('preAccumDeepLiteSuccessRatio',0)<.80: raise SystemExit('PRE-ACCUM deep-lite success below 80%')
          if not r.get('top30DoesNotGatePreAccum'): raise SystemExit('PRE-ACCUM still gated by Stage-A top-30')
          if c.get('preAccum250kTo2mUniverseCount',0)>=1 and r.get('sub2mReserveFilled',0)<1: raise SystemExit('250k-2M band exists but no qualified sub-2M candidate reached shortlist')
          banned=('xstock','tokenized stock','tokenised stock','tokenized equity','tokenised equity','tokenized etf','tokenised etf','ondo tokenized')
          for x in d.get('preAccumCandidates',[]):
              name=str(x.get('name') or '').lower()
              if any(b in name for b in banned): raise SystemExit(f"tokenized-equity leakage in PRE-ACCUM: {x.get('asset')} {x.get('name')}")
          print('CABAL PRE-ACCUM v1.5.1 PASS', d['generatedAt'], 'mode=',d.get('sourceMode'),'250k-2M=',c.get('preAccum250kTo2mUniverseCount'),'sub2m shortlist=',c.get('preAccumSub2mShortlistCount'),'preDone=',c.get('preAccumDeepLiteCompleted'),'mainMachineOperational=',d.get('mainMachineOperational'))
          PY

      - name: Verify persisted payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/cabal-machine.json | python -m json.tool >/dev/null
          echo 'CABAL MACHINE v1.5.1 PERSISTENCE PASS'

# validation-trigger: v1.5.1-resilient-prestagea-2026-09-14
