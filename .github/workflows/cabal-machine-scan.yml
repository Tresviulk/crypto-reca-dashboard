name: CABAL Independent Machine Discovery

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/cabal-machine-scan.py'
      - 'scripts/cabal-machine-scan-v14.py'
      - 'scripts/cabal-machine-scan-v141.py'
      - 'scripts/cabal-machine-scan-v15.py'
      - 'scripts/cabal-machine-scan-v151.py'
      - 'scripts/cabal-machine-scan-v16.py'
      - '.github/workflows/cabal-machine-scan.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: cabal-independent-machine-discovery
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CABAL machine v1.6 PUMP RADAR
        run: python scripts/cabal-machine-scan-v16.py

      - name: Validate v1.6 shape before persistence
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/cabal-machine.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('data/cabal-machine.json',encoding='utf-8'))
          required=('generatedAt','coverage','sources','retention','preAccumCandidates','preAccumLifecycle','preAccumOperational','mainMachineOperational','sourceMode','pumpRadar','pilotEntries','pumpRadarStats','executionEngine')
          missing=[k for k in required if k not in d]
          if missing: raise SystemExit(f'missing required keys: {missing}')
          if d.get('schemaVersion')!='1.6': raise SystemExit(f"unexpected schemaVersion: {d.get('schemaVersion')}")
          e=d.get('executionEngine',{})
          if e.get('version')!='CABAL_PUMP_PILOT_V1.6': raise SystemExit('wrong execution engine')
          if not e.get('manualOnly') or e.get('autoTrade') is not False: raise SystemExit('manual-only safety contract missing')
          print('CABAL v1.6 DIAGNOSTIC', json.dumps({'preAccumOperational':d.get('preAccumOperational'),'mainMachineOperational':d.get('mainMachineOperational'),'sourceMode':d.get('sourceMode'),'pumpRadarStats':d.get('pumpRadarStats'),'pilotEntries':[x.get('asset') for x in d.get('pilotEntries',[])[:10]],'coverage':d.get('coverage'),'sources':d.get('sources')},ensure_ascii=False))
          PY

      - name: Persist machine state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cabal-machine.json
          if git diff --cached --quiet; then
            echo 'No CABAL machine state change.'
          else
            git commit -m 'cabal-machine: refresh pump radar v1.6 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: CABAL instant PILOT alert
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          data=json.loads(Path('data/cabal-machine.json').read_text(encoding='utf-8'))
          pilots=data.get('pilotEntries') or []
          active={
              str(x.get('asset') or '').strip().upper(): x
              for x in pilots
              if x.get('executionSignal')=='PILOT_ENTRY_WINDOW' and x.get('asset')
          }
          repo=os.environ['GH_REPO']
          prefix='[CABAL PILOT] '

          def gh(*args):
              p=subprocess.run(['gh', *args], text=True, capture_output=True)
              if p.returncode != 0:
                  raise SystemExit(f"gh {' '.join(args)} failed: {p.stderr}")
              return p.stdout

          open_issues=json.loads(gh('issue','list','--repo',repo,'--state','open','--limit','100','--json','number,title'))
          alert_issues={}
          for issue in open_issues:
              title=issue.get('title') or ''
              if title.startswith(prefix):
                  asset=title[len(prefix):].strip().upper()
                  alert_issues[asset]=issue

          for asset, issue in alert_issues.items():
              if asset not in active:
                  gh('issue','close',str(issue['number']),'--repo',repo,'--comment','CABAL pilot signal is no longer active. Closing so a future reactivation can generate a new alert.')
                  print('CLOSED PILOT ALERT', asset, issue['number'])

          for asset, x in active.items():
              if asset in alert_issues:
                  print('PILOT ALERT ALREADY OPEN', asset, alert_issues[asset]['number'])
                  continue
              body=(
                  '@Tresviulk **CABAL PILOT ENTRY ALERT**\n\n'
                  f"- Asset: **{asset} ({x.get('name') or asset})**\n"
                  f"- Venue: **{x.get('venue')}**\n"
                  f"- CABAL price: **{x.get('price')}**\n"
                  f"- Pilot entry max: **{x.get('pilotEntryMax')}**\n"
                  f"- Pilot size: **{x.get('pilotSizePctOfPlannedPosition')}% of planned position**\n"
                  f"- Confirmation/add trigger: **{x.get('confirmationAddTrigger')}**\n"
                  f"- Protective stop reference: **{x.get('protectiveStopReference')}**\n"
                  f"- Signal: **{x.get('executionSignal')}**\n"
                  f"- CABAL generatedAt: **{data.get('generatedAt')}**\n\n"
                  'Manual SPOT only. No auto-trade.\n\n'
                  'This issue is created automatically immediately after a CABAL scan detects a new active pilot. '
                  'It will be closed when the signal disappears, allowing a later reactivation to alert again.'
              )
              out=gh('issue','create','--repo',repo,'--title',f'{prefix}{asset}','--body',body,'--assignee','Tresviulk')
              print('CREATED PILOT ALERT', asset, out.strip())

          print('CABAL PILOT ALERT PASS active=', ','.join(sorted(active)) if active else 'NONE')
          PY

      - name: Strict PRE-ACCUM and PUMP coverage validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('data/cabal-machine.json',encoding='utf-8'))
          c=d['coverage']; r=d['retention']; p=d.get('pumpRadarStats',{})
          if not d.get('preAccumOperational'): raise SystemExit('PRE-ACCUM operational=false')
          if c.get('preAccum')!='PASS': raise SystemExit('PRE-ACCUM coverage not PASS')
          if c.get('preAccum250kTo2mUniverseCount',0)<=0: raise SystemExit('250k-2M PRE-ACCUM band not covered')
          if c.get('preAccumShortlistCount',0)<=0: raise SystemExit('PRE-ACCUM shortlist missing')
          if c.get('preAccumDeepLiteSuccessRatio',0)<.80: raise SystemExit('PRE-ACCUM deep-lite success below 80%')
          if not r.get('top30DoesNotGatePreAccum'): raise SystemExit('PRE-ACCUM still gated by Stage-A top-30')
          if c.get('preAccum250kTo2mUniverseCount',0)>=1 and r.get('sub2mReserveFilled',0)<1: raise SystemExit('250k-2M band exists but no qualified sub-2M candidate reached shortlist')
          if p.get('preAccumLimit',0)<40: raise SystemExit('v1.6 PRE-ACCUM expansion not active')
          if p.get('preAccumSub2mReserve',0)<20: raise SystemExit('v1.6 sub-2M reserve not active')
          if p.get('fast15Attempts',0)>0 and p.get('fast15SuccessRatio',0)<.70: raise SystemExit('fast 15m confirmation coverage below 70%')
          banned=('xstock','tokenized stock','tokenised stock','tokenized equity','tokenised equity','tokenized etf','tokenised etf','ondo tokenized')
          for x in d.get('preAccumCandidates',[]):
              name=str(x.get('name') or '').lower()
              if any(b in name for b in banned): raise SystemExit(f"tokenized-equity leakage in PRE-ACCUM: {x.get('asset')} {x.get('name')}")
          for x in d.get('pilotEntries',[]):
              if x.get('executionSignal')!='PILOT_ENTRY_WINDOW': raise SystemExit('non-pilot leaked into pilotEntries')
              if not x.get('requiresProtectiveStop') or not x.get('protectiveStopReference'): raise SystemExit(f"pilot without structural stop: {x.get('asset')}")
              if x.get('pilotSizePctOfPlannedPosition',0)>25: raise SystemExit(f"pilot oversize: {x.get('asset')}")
          print('CABAL PUMP/PILOT v1.6 PASS', d['generatedAt'], 'mode=',d.get('sourceMode'),'250k-2M=',c.get('preAccum250kTo2mUniverseCount'),'preDone=',c.get('preAccumDeepLiteCompleted'),'fast15=',p.get('fast15Success'),'/',p.get('fast15Attempts'),'pumpTriggers=',p.get('fastPumpTriggerCount'),'pilots=',p.get('pilotEntryCount'))
          PY

      - name: Verify persisted payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/cabal-machine.json | python -m json.tool >/dev/null
          git show origin/main:data/cabal-machine.json | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('schemaVersion')=='1.6'; assert 'pumpRadar' in d and 'pilotEntries' in d"
          echo 'CABAL MACHINE v1.6 PERSISTENCE PASS'

# validation-trigger: v1.6-pump-pilot-alerts-2026-09-16
