name: CABAL v2 Machine Discovery

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/cabal-machine-scan-v15.py'
      - 'scripts/cabal-machine-scan-v16.py'
      - 'scripts/cabal_decision_v2.py'
      - 'scripts/cabal_ntfy_v2.py'
      - 'scripts/cabal_regression_v2.py'
      - '.github/workflows/cabal-machine-scan.yml'

permissions:
  contents: write

concurrency:
  group: cabal-v2-machine-discovery
  # A stale scan is useless for an early-entry system. Always favor the newest cycle.
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regression gate — known good and bad archetypes
        if: github.event_name != 'schedule'
        run: python scripts/cabal_regression_v2.py

      - name: Run CABAL v2 full-universe scanner
        run: python scripts/cabal-machine-scan-v16.py

      - name: Validate CABAL v2 contract
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/cabal-machine.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('data/cabal-machine.json',encoding='utf-8'))
          required=(
              'generatedAt','coverage','sources','retention','preAccumCandidates',
              'preAccumOperational','mainMachineOperational','sourceMode',
              'buyCandidates','watchCandidates','missedMoverAudit',
              'executionCandidates','decisionRadar','pumpRadarStats','executionEngine'
          )
          missing=[k for k in required if k not in d]
          if missing: raise SystemExit(f'missing required keys: {missing}')
          if d.get('schemaVersion')!='2.0':
              raise SystemExit(f"unexpected schemaVersion: {d.get('schemaVersion')}")
          e=d.get('executionEngine',{})
          if e.get('version')!='CABAL_V2.0': raise SystemExit(f"wrong execution engine: {e.get('version')}")
          if e.get('decisionEngine')!='CANONICAL_V2': raise SystemExit('canonical decision engine missing')
          if not e.get('fullExecutionUniverse'): raise SystemExit('full execution universe disabled')
          if not e.get('watchBeforeBuy'): raise SystemExit('WATCH lane disabled')
          if not e.get('manualOnly') or e.get('autoTrade') is not False: raise SystemExit('manual-only safety contract missing')
          if e.get('ntfyReScoresBuy') is not False: raise SystemExit('NTFY must not re-score BUY quality')
          print('CABAL v2 CONTRACT PASS', json.dumps({
              'buyNow':[x.get('asset') for x in d.get('buyCandidates',[])[:10]],
              'watch':[x.get('asset') for x in d.get('watchCandidates',[])[:10]],
              'coverage':d.get('coverage')
          },ensure_ascii=False))
          PY

      - name: Strict coverage and decision validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('data/cabal-machine.json',encoding='utf-8'))
          c=d['coverage']; r=d['retention']; p=d.get('pumpRadarStats',{})
          if not d.get('preAccumOperational'): raise SystemExit('PRE-ACCUM operational=false')
          if not d.get('mainMachineOperational'): raise SystemExit('main machine operational=false')
          universe=int(c.get('executionUniverseCount') or 0)
          scanned=int(c.get('mainScannedCount') or 0)
          if universe<100: raise SystemExit(f'execution universe unexpectedly small: {universe}')
          if not universe or scanned/universe < .90: raise SystemExit(f'execution scan ratio below 90%: {scanned}/{universe}')
          if not r.get('top30DoesNotGateExecution'): raise SystemExit('execution still gated by Stage-A top-30')
          if p.get('fast15Attempts',0)>0 and p.get('fast15SuccessRatio',0)<.70: raise SystemExit('15m coverage below 70%')
          core_req=set(c.get('coreRequiredAssets') or [])
          core_scanned=set(c.get('coreScannedAssets') or [])
          core_missing=set(c.get('coreMissingAssets') or [])
          required_core={'BTC','ETH','SOL','XRP','AVAX','HBAR','ONDO'}
          if not required_core.issubset(core_req): raise SystemExit(f'CORE contract incomplete: {sorted(core_req)}')
          if core_missing or not core_req.issubset(core_scanned): raise SystemExit(f'CORE coverage gap: {sorted(core_missing or (core_req-core_scanned))}')
          for x in d.get('buyCandidates',[]):
              if x.get('decisionTier')!='BUY_NOW' or x.get('buyNowEligible') is not True:
                  raise SystemExit(f'non-BUY leaked into buyCandidates: {x.get("asset")}')
              if not x.get('decisionEntryMax') or not x.get('decisionStop'):
                  raise SystemExit(f'BUY missing max/stop: {x.get("asset")}')
              sd=x.get('decisionStopDistancePct')
              if sd is None or not (1.0<=float(sd)<=4.5):
                  raise SystemExit(f'BUY invalid stop distance: {x.get("asset")} {sd}')
              head=x.get('decisionNoChaseHeadroomPct')
              if head is not None and float(head)<1.0:
                  raise SystemExit(f'BUY too close to no-chase: {x.get("asset")} {head}')
          for x in d.get('watchCandidates',[]):
              if x.get('decisionTier')!='WATCH' or x.get('watchEligible') is not True:
                  raise SystemExit(f'non-WATCH leaked into watchCandidates: {x.get("asset")}')
          print('CABAL v2 COVERAGE PASS', d['generatedAt'], 'execution=',scanned,'/',universe,'buy=',len(d.get('buyCandidates',[])),'watch=',len(d.get('watchCandidates',[])),'missedAudit=',len(d.get('missedMoverAudit',[])))
          PY

      - name: Read Cloudflare 1-minute market-guard health
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS --max-time 12 https://cabal-scanner.diondublin21.workers.dev/health -o /tmp/cabal-guard-health.json; then
            python - <<'PY'
          import json
          d=json.load(open('/tmp/cabal-guard-health.json',encoding='utf-8'))
          print('CLOUDFLARE MARKET GUARD', json.dumps({
              'healthy':d.get('healthy'),
              'lastSuccessfulScan':d.get('lastSuccessfulScan'),
              'ageSeconds':d.get('ageSeconds'),
              'schedulerLagSeconds':d.get('schedulerLagSeconds'),
              'lastObservationGapSeconds':d.get('lastObservationGapSeconds'),
              'maxObservationGapSeconds':d.get('maxObservationGapSeconds'),
              'lastError':d.get('lastError')
          },ensure_ascii=False))
          PY
          else
            printf '%s\n' '{"ok":false,"healthy":false,"mode":"CLOUDFLARE_1M_MARKET_GUARD","reason":"HEALTH_ENDPOINT_UNREACHABLE"}' > /tmp/cabal-guard-health.json
            echo 'Cloudflare Market Guard unavailable; GitHub WATCH fallback remains active.'
          fi

      - name: Snapshot previous alert state
        shell: bash
        run: |
          cp data/ntfy-alert-state.json /tmp/ntfy-alert-state-before.json 2>/dev/null || printf '%s\n' '{}' > /tmp/ntfy-alert-state-before.json

      - name: Build CABAL v2 alert from this exact scan
        run: python scripts/cabal_ntfy_v2.py

      - name: Revalidate BUY against this fresh machine state
        run: python scripts/cabal_ntfy_v2.py revalidate data/cabal-machine.json

      - name: Send CABAL v2 notification immediately
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/ntfy-payload.json)" = "null" ]; then
            echo "No notification this scan."
            printf '%s\n' '{"attempted":false,"ok":true,"kind":"NONE"}' > /tmp/ntfy-delivery-status.json
            exit 0
          fi
          title=$(python -c 'import json; print(json.load(open("/tmp/ntfy-payload.json"))["title"])')
          priority=$(python -c 'import json; print(json.load(open("/tmp/ntfy-payload.json")).get("priority","default"))')
          message=$(python -c 'import json; print(json.load(open("/tmp/ntfy-payload.json"))["message"])')
          kind=$(python -c 'import json; print(json.load(open("/tmp/ntfy-payload.json")).get("kind","UNKNOWN"))')

          # Notification transport must NEVER block scanner persistence.
          # A ntfy 429/network failure used to abort the job here, leaving
          # cabal-machine.json stale and causing the same WATCH to retry forever.
          set +e
          http_code=$(curl -sS \
            --max-time 20 \
            -o /tmp/ntfy-response.txt \
            -w "%{http_code}" \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: chart_with_upwards_trend" \
            -d "$message" \
            https://ntfy.sh/cabal-jr-7k29m4xq81)
          curl_rc=$?
          set -e

          if [ "$curl_rc" -ne 0 ]; then
            echo "::warning::NTFY transport failed rc=$curl_rc. CABAL state will still persist."
            printf '{"attempted":true,"ok":false,"kind":"%s","http":null,"rc":%s}\n' "$kind" "$curl_rc" > /tmp/ntfy-delivery-status.json
          elif [[ "$http_code" =~ ^2 ]]; then
            echo "NTFY delivery PASS HTTP $http_code"
            printf '{"attempted":true,"ok":true,"kind":"%s","http":%s,"rc":0}\n' "$kind" "$http_code" > /tmp/ntfy-delivery-status.json
          else
            echo "::warning::NTFY delivery failed HTTP $http_code. CABAL state will still persist."
            head -c 500 /tmp/ntfy-response.txt || true
            echo
            printf '{"attempted":true,"ok":false,"kind":"%s","http":%s,"rc":0}\n' "$kind" "$http_code" > /tmp/ntfy-delivery-status.json
          fi

      - name: Persist machine and alert state atomically
        shell: bash
        run: |
          set -euo pipefail
          # The freshly generated machine state and the alert state belong to the
          # same scan. Persist them together after fast-forwarding to newest main.
          cp data/cabal-machine.json /tmp/cabal-machine-v2.json
          test -f /tmp/ntfy-alert-state.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/cabal-machine-v2.json data/cabal-machine.json

          # WATCH delivery may be dropped without retry to conserve quota.
          # BUY/CANCEL are different: if transport failed, do not record them as
          # delivered. Keep the previous alert state so the next fresh scan can retry.
          delivery_kind=$(python -c 'import json,os; p="/tmp/ntfy-delivery-status.json"; d=json.load(open(p)) if os.path.exists(p) else {"kind":"NONE","ok":True}; print(d.get("kind","NONE"))')
          delivery_ok=$(python -c 'import json,os; p="/tmp/ntfy-delivery-status.json"; d=json.load(open(p)) if os.path.exists(p) else {"kind":"NONE","ok":True}; print("true" if d.get("ok") else "false")')
          if [ "$delivery_ok" != "true" ] && { [ "$delivery_kind" = "BUY" ] || [ "$delivery_kind" = "CANCEL" ]; }; then
            echo "Critical NTFY $delivery_kind was NOT delivered; preserving pending alert state for retry."
            cp /tmp/ntfy-alert-state-before.json data/ntfy-alert-state.json
          else
            cp /tmp/ntfy-alert-state.json data/ntfy-alert-state.json
          fi
          git add data/cabal-machine.json data/ntfy-alert-state.json
          if git diff --cached --quiet; then
            echo 'No CABAL state change.'
            exit 0
          fi
          git commit -m 'cabal: refresh v2 machine + alert state [skip ci]'
          git push origin HEAD:main

      - name: Verify persisted CABAL v2 payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/cabal-machine.json | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('schemaVersion')=='2.0'; assert d.get('executionEngine',{}).get('version')=='CABAL_V2.0'; assert 'buyCandidates' in d and 'watchCandidates' in d"
          echo 'CABAL v2 PERSISTENCE PASS'
