name: CABAL Independent Machine Discovery

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/cabal-machine-scan.py'
      - 'scripts/cabal-machine-scan-v14.py'
      - 'scripts/cabal-machine-scan-v141.py'
      - '.github/workflows/cabal-machine-scan.yml'

permissions:
  contents: write

concurrency:
  group: cabal-independent-machine-discovery
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run independent market-wide CABAL scan v1.4.1
        run: python scripts/cabal-machine-scan-v141.py

      - name: Validate machine payload
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/cabal-machine.json >/dev/null
          python - <<'PY'
          import json
          p='data/cabal-machine.json'
          d=json.load(open(p,encoding='utf-8'))
          required=('ok','generatedAt','coverage','sources','candidateCountStageA','deepValidatedCount','btcReference','retention')
          missing=[k for k in required if k not in d]
          if missing: raise SystemExit(f'missing required keys: {missing}')
          if d.get('schemaVersion') != '1.4.1':
              raise SystemExit(f"unexpected schemaVersion: {d.get('schemaVersion')}")
          for b in ('bucketA','bucketB','bucketC','bucketE','preAccum'):
              if d['coverage'].get(b)!='PASS': raise SystemExit(f'coverage {b} not PASS')
          if d['coverage'].get('bucketD')!='EXTERNAL_STAGE0_REQUIRED':
              raise SystemExit('bucketD must remain EXTERNAL_STAGE0_REQUIRED')
          r=d['retention']
          for k in ('limit','preAccumReserve','earlyReserve','secondLegReserve','preAccumEligible','preAccumRetained','earlyMoveEligible','earlyMoveRetained'):
              if k not in r: raise SystemExit(f'missing retention {k}')
          banned=('xstock','tokenized stock','tokenised stock','tokenized equity','tokenised equity','tokenized etf','tokenised etf')
          for c in d.get('candidates',[]):
              name=str(c.get('name') or '').lower()
              if any(x in name for x in banned):
                  raise SystemExit(f"tokenized-equity leakage: {c.get('asset')} {c.get('name')}")
          print('CABAL MACHINE v1.4.1 PAYLOAD VALID', d['generatedAt'], 'ok=', d['ok'], 'preAccum=', d['coverage'].get('preAccum'))
          PY

      - name: Commit machine state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cabal-machine.json
          if git diff --cached --quiet; then
            echo 'No CABAL machine state change.'
            exit 0
          fi
          git commit -m 'cabal-machine: refresh independent discovery v1.4.1 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify persisted payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/cabal-machine.json | python -m json.tool >/dev/null
          echo 'CABAL MACHINE v1.4.1 PERSISTENCE PASS'

# validation-trigger: gate-v1.4.1-preaccum-2026-09-14
