name: CABAL Critical Mobile Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'data/cabal-machine.json'
      - 'data/whales-early-entry-state.json'
      - '.github/workflows/cabal-critical-mobile-alerts.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: cabal-critical-mobile-alerts
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Build high-signal alert set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          alerts=[]
          day=datetime.now(timezone.utc).strftime('%Y-%m-%d')

          def n(v):
              try: return float(v)
              except: return None
          def fmt(v, digits=8):
              x=n(v)
              if x is None: return 'n/a'
              s=f'{x:.{digits}f}'.rstrip('0').rstrip('.')
              return s or '0'

          if os.path.exists('data/cabal-machine.json'):
              d=json.load(open('data/cabal-machine.json',encoding='utf-8'))
              generated=d.get('generatedAt','n/a')
              for p in d.get('pilotEntries',[]) or []:
                  if p.get('executionSignal') != 'PILOT_ENTRY_WINDOW':
                      continue
                  asset=str(p.get('asset') or p.get('base') or 'UNKNOWN').upper()
                  whales=p.get('whales') or {}
                  whale_status=whales.get('status') if isinstance(whales,dict) else None
                  title=f'[CABAL PILOT] {asset} {day}'
                  body=(
                      f'## CABAL PILOT ENTRY WINDOW — {asset}\n\n'
                      f'- Generated: `{generated}`\n'
                      f'- Venue: `{p.get("venue","n/a")}`\n'
                      f'- Current/reference price: `{fmt(p.get("price"))}`\n'
                      f'- Pilot entry max: `{fmt(p.get("pilotEntryMax"))}`\n'
                      f'- Confirmation/add trigger: `{fmt(p.get("confirmationAddTrigger"))}`\n'
                      f'- Structural stop reference: `{fmt(p.get("protectiveStopReference"))}`\n'
                      f'- Pilot size: `{p.get("pilotSizePctOfPlannedPosition","n/a")}%` of planned position\n'
                      f'- Classification: `{p.get("classification") or p.get("baseClassification") or "n/a"}`\n'
                      f'- Decision urgency: `{p.get("decisionUrgency","n/a")}`\n'
                      f'- WHALES status: `{whale_status or "n/a"}`\n\n'
                      '**Manual SPOT review only. This alert does not execute any trade.**\n'
                  )
                  alerts.append({'lane':'CABAL','asset':asset,'title':title,'body':body})

          if os.path.exists('data/whales-early-entry-state.json'):
              w=json.load(open('data/whales-early-entry-state.json',encoding='utf-8'))
              generated=w.get('generatedAt','n/a')
              for p in w.get('buyCandidates',[]) or []:
                  if not p.get('cabalValidatedForEntry'):
                      continue
                  if not p.get('marketHealthy') or p.get('noChase'):
                      continue
                  asset=str(p.get('asset') or p.get('symbol') or p.get('tokenSymbol') or p.get('token') or 'UNKNOWN').upper()
                  title=f'[WHALES EARLY] {asset} {day}'
                  sizing=p.get('positionSizing') or {}
                  body=(
                      f'## WHALES EARLY ACCUMULATION — {asset}\n\n'
                      f'- Generated: `{generated}`\n'
                      f'- Net token flow: `{p.get("netTokenFlow","n/a")}`\n'
                      f'- Meaningful accumulating wallets: `{sizing.get("meaningfulWalletCount","n/a")}`\n'
                      f'- CABAL validated for entry review: `{p.get("cabalValidatedForEntry")}`\n'
                      f'- Market healthy: `{p.get("marketHealthy")}`\n'
                      f'- No-chase flag: `{p.get("noChase")}`\n'
                      f'- Action: `{p.get("action","BUY_CANDIDATE_REVIEW")}`\n\n'
                      '**Early-warning/review signal only. This alert does not execute any trade.**\n'
                  )
                  alerts.append({'lane':'WHALES','asset':asset,'title':title,'body':body})

          unique={a['title']:a for a in alerts}
          out=list(unique.values())
          with open('/tmp/cabal-alerts.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False)
          print(f'high-signal alerts this run: {len(out)}')
          for a in out:
              print(a['title'])
          PY

      - name: Create only new daily high-signal issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count=$(jq 'length' /tmp/cabal-alerts.json)
          if [ "$count" -eq 0 ]; then
            echo 'No high-signal alerts.'
            exit 0
          fi

          jq -c '.[]' /tmp/cabal-alerts.json | while read -r row; do
            title=$(echo "$row" | jq -r '.title')
            body=$(echo "$row" | jq -r '.body')

            exists=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 200 --json title \
              | jq --arg t "$title" '[.[] | select(.title == $t)] | length')

            if [ "$exists" -gt 0 ]; then
              echo "Already alerted: $title"
              continue
            fi

            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "Created mobile alert issue: $title"
          done

      - name: Safety summary
        run: |
          echo 'CABAL Critical Mobile Alerts completed.'
          echo 'Policy: high-signal only, one issue per lane/asset/UTC day, manual SPOT review only, no auto-trading.'
