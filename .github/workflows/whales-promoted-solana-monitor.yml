name: WHALES Promoted Solana Live

on:
  schedule:
    - cron: '6,21,36,51 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/whales-promoted-solana-monitor.mjs'
      - 'data/whales-promoted-wallets.json'
      - '.github/workflows/whales-promoted-solana-monitor.yml'

permissions:
  contents: write

concurrency:
  group: whales-promoted-solana-live
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Monitor promoted wallets
        run: node scripts/whales-promoted-solana-monitor.mjs

      - name: Validate live state
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/whales-promoted-live-state.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('data/whales-promoted-live-state.json',encoding='utf-8'))
          if not d.get('generatedAt'): raise SystemExit('missing generatedAt')
          if d.get('status') not in ('PASS','PARTIAL','ERROR','PASS_NO_PROMOTED_WALLETS'): raise SystemExit('bad status')
          print('PROMOTED LIVE VALID',d['status'],'wallets=',d.get('promotedWalletCount'),'flows=',len(d.get('flows',[])))
          PY

      - name: Commit live state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/whales-promoted-live-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'whales: refresh promoted live surveillance [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify persisted state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/whales-promoted-live-state.json | python -m json.tool >/dev/null
          echo 'PROMOTED LIVE PERSISTENCE PASS'
