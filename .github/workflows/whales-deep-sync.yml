name: WHALES Deep Sync

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/whales-deep-sync.mjs'
      - '.github/workflows/whales-deep-sync.yml'

permissions:
  contents: write

concurrency:
  group: whales-deep-sync
  cancel-in-progress: true

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run WHALES DEEP through CABAL protected bridge
        run: node scripts/whales-deep-sync.mjs

      - name: Validate WHALES DEEP payload
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/whales-deep-state.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('data/whales-deep-state.json',encoding='utf-8'))
          if d.get('module')!='whalesDeepPersistence': raise SystemExit('wrong module')
          if d.get('windowsExpectedHours') != [6,24,72]: raise SystemExit('deep windows must be 6/24/72')
          if 'results' not in d: raise SystemExit('missing results')
          if not d.get('generatedAt'): raise SystemExit('missing generatedAt')
          print('WHALES DEEP VALID', d['generatedAt'], d.get('runStatus'), d.get('scan'))
          PY

      - name: Commit WHALES DEEP state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/whales-deep-state.json
          if git diff --cached --quiet; then
            echo 'No WHALES DEEP state change.'
            exit 0
          fi
          git commit -m 'whales: refresh deep 6h-24h-72h state [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify persisted state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/whales-deep-state.json | python -m json.tool >/dev/null
          echo 'WHALES DEEP PERSISTENCE PASS'
