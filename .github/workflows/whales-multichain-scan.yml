name: WHALES Multichain Scan

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/whales-multichain-scan.mjs'
      - 'scripts/whales-solana-resilient-scan.mjs'
      - 'scripts/whales-multichain-status-normalize.mjs'
      - 'config/whales-multichain.json'
      - '.github/workflows/whales-multichain-scan.yml'

permissions:
  contents: write

concurrency:
  group: whales-multichain-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run WHALES multichain scan
        run: node scripts/whales-multichain-scan.mjs

      - name: Rescan Solana with provider failover
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SOLANA_RPC_URL_2: ${{ secrets.SOLANA_RPC_URL_2 }}
        run: node scripts/whales-solana-resilient-scan.mjs

      - name: Normalize multichain status semantics
        run: node scripts/whales-multichain-status-normalize.mjs

      - name: Validate multichain payload
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/whales-multichain-state.json >/dev/null
          python - <<'PY'
          import json
          p='data/whales-multichain-state.json'
          d=json.load(open(p,encoding='utf-8'))
          if not d.get('generatedAt'): raise SystemExit('missing generatedAt')
          required={'ethereum','base','arbitrum','hyperliquid','solana'}
          got=set(d.get('chains',{}))
          missing=required-got
          if missing: raise SystemExit(f'missing chains: {sorted(missing)}')
          sol_count=d.get('architecture',{}).get('trackedSolanaWallets',0)
          if sol_count > 0 and d.get('overallStatus') == 'PARTIAL_SOLANA_WALLETS_REQUIRED':
              raise SystemExit('invalid Solana status: wallets exist but status says wallets required')
          sol=d.get('chains',{}).get('solana',{})
          if sol_count > 0 and sol.get('mode') != 'RESILIENT_PUBLIC_RPC_FAILOVER':
              raise SystemExit('resilient Solana layer missing')
          if len(sol.get('rpcProviders',[])) < 2:
              raise SystemExit('Solana RPC provider pool has fewer than 2 providers')
          print('WHALES MULTICHAIN VALID', d['generatedAt'], d.get('overallStatus'))
          print('CHAIN STATUS', d.get('architecture',{}).get('chains'))
          print('SOLANA RESILIENCE', d.get('resilience',{}))
          PY

      - name: Commit multichain state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/whales-multichain-state.json
          if git diff --cached --quiet; then
            echo 'No WHALES multichain state change.'
            exit 0
          fi
          git commit -m 'whales: refresh multichain state [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "WHALES multichain state persisted on attempt ${attempt}."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Verify persisted state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/whales-multichain-state.json | python -m json.tool >/dev/null
          echo 'WHALES MULTICHAIN PERSISTENCE PASS'
