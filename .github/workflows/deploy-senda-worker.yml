name: Deploy SENDA Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'cloudflare/senda-scanner/**'
      - '.github/workflows/deploy-senda-worker.yml'

permissions:
  contents: read

concurrency:
  group: deploy-senda-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate SENDA worker
        run: |
          node --check cloudflare/senda-scanner/src/index.js
          grep -q 'FULL_COINBASE_KUCOIN_DYNAMIC_CANDIDATES' cloudflare/senda-scanner/src/index.js
      - name: Deploy SENDA worker
        working-directory: cloudflare/senda-scanner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Verify health and full scan
        run: |
          set -euo pipefail
          sleep 8
          curl -fsS --retry 5 --retry-delay 3 https://senda-scanner.diondublin21.workers.dev/health
          HTTP=$(curl -sS --max-time 180 -o /tmp/senda-scan.json -w '%{http_code}' https://senda-scanner.diondublin21.workers.dev/scan)
          echo "SENDA /scan HTTP ${HTTP}"
          cat /tmp/senda-scan.json
          echo
          if [ "${HTTP}" != "200" ]; then
            exit 1
          fi
          python - <<'PY'
          import json, subprocess
          p=json.load(open('/tmp/senda-scan.json',encoding='utf-8'))
          if p.get('system')!='SENDA':
              raise SystemExit(p)
          if p.get('mode')!='FULL_COINBASE_KUCOIN_DYNAMIC_CANDIDATES':
              raise SystemExit(p)
          c=p.get('coverage') or {}
          if int(c.get('uniqueAssets') or 0)<=20:
              raise SystemExit(f"full universe not scanned: {c}")
          candidates=p.get('candidates') or []
          if len(candidates)<20:
              raise SystemExit(f"candidate pool too small: {len(candidates)}")
          sample=candidates[0]
          cp=subprocess.run([
              'curl','-sS','--max-time','90',
              '-H','content-type: application/json',
              '-d',json.dumps(sample),
              'https://senda-scanner.diondublin21.workers.dev/deep'
          ],capture_output=True,text=True,check=True)
          d=json.loads(cp.stdout)
          result=d.get('result') or {}
          if not d.get('ok') or not result.get('technical'):
              raise SystemExit(f"deep analysis failed: {d}")
          for tf in ('4h','1d'):
              t=(result.get('technical') or {}).get(tf) or {}
              for k in ('ema20','ema50','rsi14','adx14'):
                  if t.get(k) is None:
                      raise SystemExit(f"missing {tf} {k}: {d}")
          print('SENDA FULL SCAN PASS', json.dumps({'coverage':c,'candidatePool':len(candidates),'deepSample':result.get('asset'),'elapsedSeconds':p.get('elapsedSeconds')},ensure_ascii=False))
          PY
